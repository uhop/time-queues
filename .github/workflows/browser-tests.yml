# Advisory browser suite: DOM-driven paths (PageWatcher, FrameQueue, IdleQueue,
# whenLoaded/whenDomLoaded) on Chromium + Firefox + WebKit. Not a PR gate —
# runs on pushes to main and on demand.

name: Browser tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    name: Chromium + Firefox + WebKit on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser:all
